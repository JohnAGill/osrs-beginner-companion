[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beginner-companion"
version = "0.1.0"
description = "Explainable beginner OSRS goal recommendations with a RuneLite sidebar"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.162.0", "pydantic==2.14.1", "uvicorn==0.54.0"]
api-test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["beginner_companion*"]

[tool.setuptools.package-data]
"beginner_companion.domain" = ["goals.json"]
